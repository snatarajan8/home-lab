[global]
refresh=2
check_update=False
history_size=1200

[outputs]
# No specific output configuration needed for Prometheus as it's enabled via command line

[prometheus]
# Prometheus exporter configuration
# This is to ensure it binds to 0.0.0.0 and uses the correct port
# even if the command line arguments are ignored.
host=0.0.0.0
port=61208

[processlist]
enable=True
disable=False
