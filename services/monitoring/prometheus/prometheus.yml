global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'node_exporter'
    static_configs:
      - targets: ['node-exporter:9100']

  - job_name: 'glances'
    static_configs:
      - targets: ['glances:61208']

  - job_name: 'process_exporter'
    static_configs:
      - targets: ['process-exporter:9256']

  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']
